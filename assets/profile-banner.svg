<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Lei Lou - AI and Computational Biology">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061427"/>
      <stop offset="0.52" stop-color="#10384C"/>
      <stop offset="1" stop-color="#0B6F6B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E6BE"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#A8EDE3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <circle cx="1050" cy="150" r="230" fill="#4CC9F0" fill-opacity="0.05"/>

  <text x="70" y="62" fill="#63E6BE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">GITHUB PROFILE · 2026</text>
  <rect x="70" y="78" width="58" height="4" rx="2" fill="url(#edge)"/>

  <text x="66" y="158" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="1">LEI LOU</text>
  <text x="70" y="202" fill="#A8EDE3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500">AI × COMPUTATIONAL BIOLOGY</text>
  <text x="70" y="242" fill="#CFE9F2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">From molecular simulation to enterprise AI — building where computation meets life science.</text>

  <g>
    <rect x="760" y="44" width="452" height="212" rx="22" fill="#061427" fill-opacity="0.72" stroke="#63E6BE" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="790" cy="72" r="5" fill="#FF6B6B"/>
    <circle cx="808" cy="72" r="5" fill="#FFD166"/>
    <circle cx="826" cy="72" r="5" fill="#63E6BE"/>
    <line x1="760" y1="92" x2="1212" y2="92" stroke="#A8EDE3" stroke-opacity="0.14"/>

    <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="17">
      <text x="790" y="126" fill="#63E6BE">&gt; profile --focus=ai+bio</text>
      <text x="790" y="158" fill="#E8F4F8">protein.design(AlphaFold3)</text>
      <text x="790" y="190" fill="#4CC9F0">simulate(GROMACS, 300ns)</text>
      <text x="790" y="222" fill="#E8F4F8">train(PyTorch, omics_data)</text>
    </g>

    <g fill="#4CC9F0" opacity="0.8">
      <circle cx="1150" cy="126" r="4"/>
      <circle cx="1176" cy="158" r="4"/>
      <circle cx="1150" cy="190" r="4"/>
      <circle cx="1176" cy="222" r="4"/>
    </g>
    <g stroke="#4CC9F0" stroke-opacity="0.35" stroke-width="1.5">
      <line x1="1150" y1="126" x2="1176" y2="158"/>
      <line x1="1176" y1="158" x2="1150" y2="190"/>
      <line x1="1150" y1="190" x2="1176" y2="222"/>
    </g>
  </g>

  <text x="1208" y="282" text-anchor="end" fill="#CFE9F2" fill-opacity="0.72" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">github.com/leiloull</text>
</svg>
